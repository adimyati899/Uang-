<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIMI – Motion</title>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
#stage{position:relative;height:100vh;max-width:100vw;aspect-ratio:9/16;overflow:hidden;background:#001A0E;container-type:inline-size;perspective:1200px}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .5s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scene.show{opacity:1}
.dark{background:radial-gradient(circle at 50% 30%,#0b5233,#001A0E 70%)}

/* SCENE 1 – 3D G */
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover}
.blob{position:absolute;width:80cqw;height:80cqw;border-radius:50%;background:radial-gradient(circle,#00C389,transparent 70%);filter:blur(5cqw);opacity:0}
.on .blob{animation:swirl 3s ease-out both}
@keyframes swirl{0%{transform:scale(.2) rotate(0);opacity:0}40%{opacity:.9}100%{transform:scale(1.1) rotate(270deg);opacity:.5}}
.g3d{position:relative;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:900;font-size:85cqw;line-height:1;color:#001A0E;
 text-shadow:.4cqw .4cqw 0 #003a22,.8cqw .8cqw 0 #00462a,1.2cqw 1.2cqw 0 #005232,1.6cqw 1.6cqw 0 #00603b,2cqw 2cqw 0 #00C389,0 0 10cqw rgba(0,195,137,.6)}
.on .g3d{animation:gBirth 1.8s cubic-bezier(.2,1.2,.3,1) both,gSpin 1.6s 1.6s ease-in-out both}
@keyframes gBirth{0%{transform:scale(.3) rotateY(-180deg);opacity:0;filter:blur(3cqw)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1) rotateY(0)}}
@keyframes gSpin{0%{transform:rotateY(0)}50%{transform:rotateY(25deg) scale(1.04)}100%{transform:rotateY(0) scale(1.08)}}
.shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%);mix-blend-mode:soft-light;transform:translateX(-100%)}
.on .shine{animation:sweep 1.2s 1.5s ease-in-out both}
@keyframes sweep{to{transform:translateX(100%)}}

/* SCENE 2 – Model push-in */
.model{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 50%;transform-origin:55% 45%}
.on .model{animation:push 5s ease-in-out both}
@keyframes push{from{transform:scale(1.05)}to{transform:scale(1.55)}}
.caption{position:absolute;left:7cqw;bottom:10cqw;font-size:9cqw;line-height:1.1;color:#001A0E;font-weight:300;opacity:0}
.caption b{font-weight:800;color:#00a070}
.on .caption{animation:up .9s 1s cubic-bezier(.2,1.3,.4,1) both}

/* UI cards */
.card{position:relative;z-index:2;transform-style:preserve-3d}
.card img{display:block;width:100%;border-radius:4cqw;box-shadow:0 5cqw 12cqw rgba(0,0,0,.6),0 0 7cqw rgba(0,195,137,.35)}
.in{width:86cqw}
.on .in{animation:tiltIn 1.2s cubic-bezier(.2,1.3,.4,1) both,float 4s 1.2s ease-in-out infinite}
@keyframes tiltIn{from{transform:translateY(70cqw) rotateX(65deg) scale(.8);opacity:0}to{transform:rotateX(8deg);opacity:1}}
@keyframes float{0%,100%{transform:rotateX(8deg) rotateY(-4deg) translateY(0)}50%{transform:rotateX(3deg) rotateY(4deg) translateY(-2cqw)}}
.ripple{position:absolute;width:14cqw;height:14cqw;margin:-7cqw 0 0 -7cqw;border-radius:50%;border:.7cqw solid #00C389;box-shadow:0 0 4cqw #00C389;opacity:0}
.on .ripple{animation:rip 1s 2.6s ease-out 2}
.on .ripple.late{animation-delay:3.4s}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.6);opacity:0}}

/* SCENE 4 – Reward */
.count{position:relative;z-index:3;font-size:24cqw;font-weight:900;margin-bottom:5cqw;background:linear-gradient(90deg,#b6e86a,#2fd6b0);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.on .count{animation:up .6s .3s both}
.rw{width:82cqw}
.on .rw{animation:rotIn 1.2s cubic-bezier(.2,1.3,.4,1) both,float 4s 1.2s ease-in-out infinite}
@keyframes rotIn{from{transform:translateX(-60cqw) rotateY(-90deg);opacity:0}to{transform:rotateX(8deg);opacity:1}}
#coins{position:absolute;inset:0;z-index:4;pointer-events:none}
.coin{position:absolute;top:-12cqw;width:9cqw;height:9cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8affd6,#00C389 50%,#00664a);box-shadow:inset 0 0 0 .8cqw rgba(255,255,255,.25),0 0 3cqw rgba(0,195,137,.6);animation:fall linear both}
@keyframes fall{to{transform:translateY(200cqw) rotateX(720deg) rotateZ(200deg)}}

/* SCENE 5 – Campaign + orbit */
.cp{width:62cqw}
.on .cp{animation:tiltIn 1.2s cubic-bezier(.2,1.3,.4,1) both,float 4s 1.2s ease-in-out infinite}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:1}
.thumb{position:absolute;width:20cqw;height:35cqw;margin:-17.5cqw 0 0 -10cqw;border-radius:3cqw;border:.5cqw solid #00C389;background:url(model.jpg) center/cover;box-shadow:0 0 5cqw rgba(0,195,137,.5);
 transform:rotate(calc(var(--a) + var(--o))) translateX(46cqw) rotate(calc(-1*(var(--a) + var(--o))))}
.on .thumb{animation:orbit 9s linear infinite}
@keyframes orbit{to{--a:360deg}}

/* SCENE 6 – Outro */
#s6{background:#00C389}
#s6::before{content:'';position:absolute;inset:0;background:#fff;opacity:0}
#s6.on::before{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#burst{position:absolute;left:50%;top:50%}
.p{position:absolute;border-radius:50%;animation:burst 1.4s cubic-bezier(.1,.8,.3,1) both}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.logo{width:40cqw;border-radius:8cqw;box-shadow:0 4cqw 10cqw rgba(0,26,14,.35);opacity:0}
.on .logo{animation:logoIn 1.2s .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logoIn{from{transform:rotateY(180deg) scale(.2);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
.word{font-size:26cqw;font-weight:900;letter-spacing:-1cqw;color:#001A0E;margin-top:4cqw;opacity:0}
.pill{border:.4cqw solid #001A0E;border-radius:10cqw;padding:2cqw 5cqw;font-size:4cqw;letter-spacing:.8cqw;color:#001A0E;font-weight:600;opacity:0}
.tag{margin-top:9cqw;font-size:7cqw;font-weight:700;color:#001A0E;opacity:0}
.on .word{animation:up .8s 1.3s cubic-bezier(.2,1.3,.4,1) both}
.on .pill{animation:up .8s 1.7s cubic-bezier(.2,1.3,.4,1) both}
.on .tag{animation:up .8s 2.2s cubic-bezier(.2,1.3,.4,1) both}
@keyframes up{from{transform:translateY(8cqw);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1"><div class="bg"></div><div class="blob"></div><div class="g3d">G</div><div class="shine"></div></div>

  <div class="scene" id="s2"><img class="model" src="model.jpg" alt=""><div class="caption">Your brand.<br><b>Their voice.</b></div></div>

  <div class="scene dark" id="s3"><div class="card in"><img src="ui-input.png" alt=""><span class="ripple" style="left:87.5%;top:83.5%"></span></div></div>

  <div class="scene dark" id="s4"><div class="count" id="count">$0</div><div class="card rw"><img src="ui-reward.png" alt=""></div><div id="coins"></div></div>

  <div class="scene dark" id="s5">
    <div class="orbit">
      <div class="thumb" style="--o:0deg;background-position:60% 30%"></div>
      <div class="thumb" style="--o:72deg;background-position:40% 60%;filter:hue-rotate(20deg)"></div>
      <div class="thumb" style="--o:144deg;background-position:55% 45%;filter:saturate(1.4)"></div>
      <div class="thumb" style="--o:216deg;background-position:30% 70%;filter:hue-rotate(-20deg)"></div>
      <div class="thumb" style="--o:288deg;background-position:65% 50%;filter:brightness(1.1)"></div>
    </div>
    <div class="card cp"><img src="ui-campaign.png" alt=""><span class="ripple late" style="left:50%;top:91%"></span></div>
  </div>

  <div class="scene" id="s6"><div id="burst"></div><img class="logo" src="logo.png" alt=""><div class="word">GIMI</div><div class="pill">● CAMPAIGN AGENT</div><div class="tag">Brief in. Creators out.</div></div>
</div>

<script>
const S=[['s1',3000],['s2',5000],['s3',5000],['s4',5000],['s5',5000],['s6',5000]];
let i=0,prev=null;
const $=id=>document.getElementById(id);

function countUp(){
  const el=$('count'),t0=performance.now();
  (function f(t){let p=Math.max(0,Math.min((t-t0-600)/1800,1));
    el.textContent='$'+Math.round(400*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(f);})(t0);
}
function coins(){
  const c=$('coins');c.innerHTML='';
  for(let k=0;k<14;k++){const d=document.createElement('div');d.className='coin';
    d.style.left=(5+Math.random()*82)+'cqw';
    d.style.animationDuration=(1.8+Math.random()*1.2)+'s';
    d.style.animationDelay=(0.8+Math.random()*2)+'s';c.appendChild(d);}
}
function burst(){
  const b=$('burst');b.innerHTML='';
  for(let k=0;k<45;k++){const p=document.createElement('div');p.className='p';
    const a=Math.random()*Math.PI*2,r=40+Math.random()*60,s=1+Math.random()*3;
    p.style.cssText=`width:${s}cqw;height:${s}cqw;margin:${-s/2}cqw;background:${k%3?'#001A0E':'#fff'};--x:${Math.cos(a)*r}cqw;--y:${Math.sin(a)*r}cqw`;
    b.appendChild(p);}
}
function play(){
  const [id,d]=S[i],el=$(id);
  if(prev){const p=prev;p.classList.remove('show');setTimeout(()=>p.classList.remove('on'),600);}
  el.classList.remove('on');void el.offsetWidth;el.classList.add('on','show');
  if(id==='s4'){countUp();coins();}
  if(id==='s6')burst();
  prev=el;i=(i+1)%S.length;setTimeout(play,d);
}
play();
</script>
</body>
  </html>
